[package]
name = "novad"
version = "0.1.0"
edition = "2021"
description = "NPU-accelerated wake word daemon, handing off to voxtype for transcription"
license = "MIT"

[[bin]]
name = "novad"
path = "src/main.rs"

[dependencies]
# Raw OpenVINO Core API (Core/Model/CompiledModel/InferRequest) — the
# 3-stage wake-word pipeline is plain inference, not GenAI, so this is
# the plain `openvino` crate, unpatched, straight from crates.io.
openvino = "0.11"

# LLM inference for `novad serve` (OpenAI-compatible local provider).
# Unlike WhisperPipeline (see voxtype's Cargo.toml [patch.crates-io]),
# LlmPipeline already has with_properties() upstream — no fork needed
# here, plain crates.io release.
openvino-genai = { version = "0.11", features = ["runtime-linking"] }

# Mic capture — same underlying crate voxtype uses via cpal_capture.rs,
# used directly here since novad's always-on listen loop doesn't fit
# voxtype's push-to-talk-shaped AudioCapture trait.
cpal = "0.15"

# `novad serve`'s OpenAI-compatible HTTP surface.
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# `novad classify`'s client side — a blocking call against novad serve's
# own /v1/chat/completions, same crate voxtype itself uses for its
# remote/API calls (see voxtype's Cargo.toml). Blocking, not reqwest:
# classify() is called from sync contexts (the detect loop) and doesn't
# want to drag a tokio runtime along just to make one HTTP call.
ureq = { version = "2", features = ["json"] }

clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"
dirs = "5"

[profile.release]
lto = true
strip = true
opt-level = 3
