[package]
name = "omarchy-novad"
version = "0.1.0"
edition = "2021"
description = "NPU-accelerated wake word daemon, handing off to voxtype for transcription"
license = "MIT"

[[bin]]
name = "omarchy-novad"
path = "src/main.rs"

[dependencies]
# Raw OpenVINO Core API (Core/Model/CompiledModel/InferRequest) — the
# 3-stage wake-word pipeline is plain inference, not GenAI, so this is
# the plain `openvino` crate, unpatched, straight from crates.io.
openvino = "0.11"

# LLM inference for `omarchy-novad serve` (OpenAI-compatible local provider).
# Unlike WhisperPipeline (see voxtype's Cargo.toml [patch.crates-io]),
# LlmPipeline already has with_properties() upstream — no fork needed
# here, plain crates.io release.
openvino-genai = { version = "0.11", features = ["runtime-linking"] }

# Mic capture — same underlying crate voxtype uses via cpal_capture.rs,
# used directly here since omarchy-novad's always-on listen loop doesn't fit
# voxtype's push-to-talk-shaped AudioCapture trait.
cpal = "0.15"

# `omarchy-novad serve`'s OpenAI-compatible HTTP surface.
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
tokio-stream = "0.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Persistent config file (~/.config/omarchy-novad/config.toml) -- see
# config.rs. Everything was CLI-flags-only until Home Assistant needed
# somewhere to keep a token that isn't shell history or `ps aux`.
toml = "0.8"

# Structured in-place edits to config.toml's [spotify] section
# (refresh_token/access_token/expires_at, written back after OAuth and
# every token refresh) that preserve the rest of the file -- comments,
# formatting, [home_assistant]'s token -- byte for byte. Plain `toml`
# only round-trips a full Config struct back to a fresh document,
# which would silently drop every comment in a file the user hand-
# edits and curates.
toml_edit = "0.22"

# `omarchy-novad classify`'s client side — a blocking call against
# omarchy-novad serve's own /v1/chat/completions, same crate voxtype
# itself uses for its remote/API calls (see voxtype's Cargo.toml).
# Blocking, not reqwest: classify() is called from sync contexts (the
# detect loop) and doesn't want to drag a tokio runtime along just to
# make one HTTP call.
ureq = { version = "2", features = ["json"] }

clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"
dirs = "5"

[profile.release]
lto = true
strip = true
opt-level = 3
